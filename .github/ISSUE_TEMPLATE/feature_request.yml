name: Feature request
description: Suggest an idea for Vantage Seeker
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please keep in mind that Vantage Seeker is a research workbench, not a production trading system.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? Who is it for?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, or screenshots that support the request.
